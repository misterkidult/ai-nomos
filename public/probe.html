<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-nomos · WebMCP 探針</title>
<style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.7;color:#212529;background:#EAEAEA}
h1{font-size:22px}code{background:#fff;border:1px solid #000;padding:1px 6px}
.box{background:#fff;border:1px solid #000;padding:16px;margin:16px 0}
.ok{color:#0a7d2c}.no{color:#b00020}
#log div{padding:6px 0;border-top:1px solid #ddd;font-size:14px}
button{border:1px solid #000;background:#C5FF4A;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<h1>ai-nomos · WebMCP 探針</h1>
<p>目的：確認這個瀏覽器裡的 agent 叫得到 <code>document.modelContext</code>（ChatGPT）或 <code>navigator.modelContext</code>（Chrome）註冊的工具，以及 <code>requestUserInteraction</code> 會不會跳確認框。</p>

<div class="box">
  <div>環境：<span id="env">偵測中…</span></div>
  <div>已註冊工具：<span id="tools">—</span></div>
  <div>最後一次寫入：<span id="last">尚無</span></div>
</div>

<div class="box">
  <p><strong>請對你的 agent 說：</strong></p>
  <ol>
    <li>「呼叫 <code>ping</code> 工具」→ 應回 <code>pong</code>＋時間</li>
    <li>「呼叫 <code>writeNote</code>，note 寫『測試』」→ 應先跳確認框，確認後畫面「最後一次寫入」會更新</li>
  </ol>
  <p>沒有 agent 也可以按 <button id="selftest">本機自測（Chrome 152 原生 document.modelContext）</button></p>
</div>

<div class="box"><strong>紀錄</strong><div id="log"></div></div>

<script>
const $=id=>document.getElementById(id);
const log=(m,cls)=>{const d=document.createElement('div');d.textContent=new Date().toLocaleTimeString()+'　'+m;if(cls)d.className=cls;$('log').prepend(d)};
function pick(){return (typeof document.modelContext?.registerTool==='function')?document.modelContext:(navigator.modelContext&&typeof navigator.modelContext.registerTool==='function')?navigator.modelContext:null}
let tries=0;$('env').textContent='偵測中…（最多等 10 秒，ChatGPT 可能在載入後才注入）';
const timer=setInterval(()=>{const mc=pick();tries++;
  if(mc){clearInterval(timer);setup(mc,tries)}
  else if(tries>=20){clearInterval(timer);$('env').innerHTML='<span class="no">等了 10 秒，document.modelContext 與 navigator.modelContext 都不存在</span><br>ChatGPT 桌面版：Settings › Browser › Permissions 開「Enable site tools」，模型選 GPT-5.6 Sol／Terra（Luna 關閉）<br>Chrome：152 原生有 document.modelContext；146–151 需 Canary／Beta 開 chrome://flags/#enable-webmcp-testing';log('無 modelContext，退化模式','no');}
},500);
function setup(mc,tries){
  const which=mc===document.modelContext?'document.modelContext':'navigator.modelContext';
  $('env').innerHTML='<span class="ok">'+which+' 存在</span>（第 '+tries+' 次偵測到；'+navigator.userAgent.slice(0,50)+'…）';
  const tools=[
    {name:'ping',description:'回 pong 與伺服器時間。用來確認 agent 叫得到這頁的工具。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},
     async execute(){log('ping 被呼叫','ok');return {result:'pong',time:new Date().toISOString()}}},
    {name:'writeNote',description:'寫一則測試筆記到畫面上。這是寫入動作，執行前會請使用者確認。',inputSchema:{type:'object',properties:{note:{type:'string',description:'要寫的內容'}},required:['note'],additionalProperties:false},
     async execute(input,client){
       log('writeNote 被呼叫，note='+JSON.stringify(input&&input.note));
       let confirmed='（未提供 requestUserInteraction）';
       if(client&&client.requestUserInteraction){
         try{const r=await client.requestUserInteraction({message:'agent 想寫入：'+input.note+'，允許嗎？'});confirmed='requestUserInteraction 回傳：'+JSON.stringify(r);log(confirmed,'ok');}
         catch(e){confirmed='requestUserInteraction 失敗：'+e.message;log(confirmed,'no');}
       }else log('client 沒有 requestUserInteraction','no');
       $('last').textContent=input.note+'　'+new Date().toLocaleTimeString();
       return {result:'written',note:input.note,confirmation:confirmed};
     }}
  ];
  try{tools.forEach(t=>{const r=mc.registerTool(t);if(r&&r.then)r.catch(e=>log('registerTool '+t.name+' 失敗：'+e.message,'no'))});$('tools').textContent=tools.map(t=>t.name).join('、');log('已註冊 '+tools.length+' 個工具','ok');}
  catch(e){$('tools').innerHTML='<span class="no">registerTool 失敗：'+e.message+'</span>';log('registerTool 失敗：'+e.message,'no');}
}
$('selftest').onclick=async()=>{
  // Chrome 152 原生：document.modelContext.getTools()／executeTool(toolObj, jsonString) → string
  const ctx=(document.modelContext&&document.modelContext.getTools)?document.modelContext:(navigator.modelContextTesting||null);
  if(!ctx){log('沒有 getTools／executeTool 可用（Chrome 152 走 document.modelContext；舊版走 navigator.modelContextTesting）','no');return}
  try{const list=await ctx.getTools();log('getTools → '+list.map(x=>x.name).join('、'),'ok');
      const find=n=>list.find(x=>x.name===n);
      const r=await ctx.executeTool(find('ping'),JSON.stringify({}));log('executeTool ping → '+(typeof r==='string'?r:JSON.stringify(r)),'ok');
      const w=await ctx.executeTool(find('writeNote'),JSON.stringify({note:'自測'}));log('executeTool writeNote → '+(typeof w==='string'?w:JSON.stringify(w)),'ok');}
  catch(e){log('自測失敗：'+e.message,'no')}
};
</script>
</body>
</html>
